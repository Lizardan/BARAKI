name: Deploy landing

# Static Cloudflare Pages site. Does not build Unity or the updater.

on:
  push:
    branches:
      - main
    paths:
      - "Tooling/cloudflare/baraki-landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: baraki
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy Pages landing
        working-directory: Tooling/cloudflare/baraki-landing
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT" \
            --production-branch=main || true
          npx wrangler pages deploy ./public \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch=main
