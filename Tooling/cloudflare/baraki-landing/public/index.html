<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="BARAKI — мультиплеерная FFA-стратегия для Windows. Строй базу, держи экономику и оборону, а армии сами идут в бой." />
  <meta name="theme-color" content="#080908" />
  <meta property="og:title" content="BARAKI" />
  <meta property="og:description" content="Мультиплеерная FFA-стратегия для Windows x64." />
  <meta property="og:type" content="website" />
  <title>BARAKI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #080908;
      --shell: #101211;
      --panel: #151716;
      --text: #dedbd2;
      --title: #d0b276;
      --gold: #b99a62;
      --muted: #62665f;
      --line: #343832;
      --btn: #403623;
      --btn-hover: #504228;
      --btn-border: #b99a62;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: "Noto Sans", ui-sans-serif, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .ambient,
    .shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .ambient--left {
      width: 42%;
      left: -4%;
      right: auto;
      background: rgba(185, 154, 98, 0.07);
    }

    .ambient--right {
      width: 42%;
      right: -6%;
      left: auto;
      background: rgba(133, 137, 128, 0.05);
    }

    .shade {
      background: rgba(8, 9, 8, 0.18);
    }

    main {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 2.5rem 1.25rem;
    }

    .shell {
      position: relative;
      width: min(100%, 52rem);
      overflow: hidden;
      background: var(--shell);
      border: 1px solid var(--line);
    }

    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: var(--gold);
      pointer-events: none;
    }

    .corner--tl {
      top: 0;
      left: 0;
      border-top: 2px solid var(--gold);
      border-left: 2px solid var(--gold);
    }

    .corner--br {
      right: 0;
      bottom: 0;
      border-right: 2px solid var(--gold);
      border-bottom: 2px solid var(--gold);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 5.5rem;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      margin: 0;
      color: var(--title);
      font-size: clamp(1.6rem, 4vw, 2.05rem);
      font-weight: 700;
      letter-spacing: 0.38em;
      line-height: 1;
    }

    .version {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .body {
      padding: clamp(2rem, 5vw, 3.4rem) clamp(1.4rem, 4vw, 2.6rem) 2.4rem;
      text-align: center;
      background: var(--panel);
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .subtitle {
      max-width: 38rem;
      margin: 0 auto;
      color: var(--text);
      font-size: clamp(1.02rem, 2.2vw, 1.18rem);
      line-height: 1.7;
    }

    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: min(100%, 16.5rem);
      margin-top: 2.2rem;
      padding: 1.05rem 1.7rem;
      border: 1px solid var(--btn-border);
      color: var(--title);
      background: var(--btn);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease;
    }

    .download:hover,
    .download:focus-visible {
      color: var(--text);
      background: var(--btn-hover);
      border-color: var(--title);
    }

    .meta {
      margin: 0.95rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      letter-spacing: 0.04em;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1.1rem;
      justify-content: center;
      margin-top: 2rem;
      padding-top: 1.3rem;
      border-top: 1px solid var(--line);
      font-size: 0.92rem;
    }

    .links a {
      color: var(--muted);
      text-decoration: none;
    }

    .links a:hover,
    .links a:focus-visible {
      color: var(--title);
    }

    @media (max-width: 640px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        min-height: 0;
        padding: 1.15rem 1.2rem;
      }

      .brand {
        letter-spacing: 0.28em;
      }
    }
  </style>
</head>
<body>
  <div class="ambient ambient--left" aria-hidden="true"></div>
  <div class="ambient ambient--right" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>
  <main>
    <section class="shell" aria-labelledby="title">
      <span class="corner corner--tl" aria-hidden="true"></span>
      <span class="corner corner--br" aria-hidden="true"></span>
      <header class="header">
        <h1 id="title" class="brand">BARAKI</h1>
        <p class="version" id="version">Windows x64</p>
      </header>
      <div class="body">
        <p class="eyebrow">Мультиплеерная FFA-стратегия</p>
        <p class="subtitle">
          Строй базу, держи экономику и оборону, а армии сами идут в бой.
          Установщик ставит обновляющий клиент, который подтянет последнюю полноценную версию игры.
        </p>
        <a class="download" href="/download">Скачать</a>
        <p class="meta">BARAKI-Setup.exe · Windows x64</p>
        <nav class="links" aria-label="Ссылки">
          <a href="https://lizardan.github.io/BARAKI/privacy.html">Privacy Policy</a>
          <a href="https://lizardan.github.io/BARAKI/terms.html">Terms of Service</a>
        </nav>
      </div>
    </section>
  </main>
</body>
</html>
