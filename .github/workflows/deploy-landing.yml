name: Deploy landing

# Static Cloudflare Pages site. Does not build Unity or the updater.

on:
  push:
    branches:
      - main
    paths:
      - "Tooling/cloudflare/baraki-landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: baraki
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy Pages landing
        working-directory: Tooling/cloudflare/baraki-landing
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT" \
            --production-branch=main || true
          # Existing project may still have production_branch=production.
          # --branch=main then lands on main.baraki.pages.dev, not baraki.pages.dev.
          curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"production_branch":"main"}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('production_branch=', (d.get('result') or {}).get('production_branch'), 'success=', d.get('success'), d.get('errors'))"
          npx wrangler pages deploy ./public \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch=main
